name: CI

# Sanity checks on every push/PR: every script at least parses, and the unit
# tests around the fines logic (real money — see apply_lmp_fines.js /
# api/override-bottom3.js) still pass.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Syntax-check every script
        run: |
          status=0
          for f in $(git ls-files '*.js' | grep -v '^node_modules/'); do
            node --check "$f" || status=1
          done
          exit $status

      - name: Unit tests
        run: node --test
