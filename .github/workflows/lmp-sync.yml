name: LMP weekly sync

# Applies the weekly LMP bottom-3 fines and refreshes live points from the
# public FPL API, then commits the updated data back so Vercel rebuilds.
#
# Timing note: bottom-3 needs FINAL post-hits scores, which include bonus
# points that the FPL API only settles ~1-2 days after a gameweek's matches.
# So this is keyed off the gameweek being *finished*, not the deadline. The
# daily cron + idempotent script means a finished GW is picked up within 24h
# and re-runs are no-ops until there's a new GW to process.

on:
  schedule:
    - cron: '0 6 * * *'        # 06:00 UTC daily; idempotent, only writes on a new finished GW
  workflow_dispatch:
    inputs:
      gw:
        description: 'Specific GW to process (blank = latest finished)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (compute only, no commit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write              # needed to commit data.json / fpl_data.json back

concurrency:
  group: lmp-sync              # never let two syncs race on the same files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'   # global fetch built in; no npm install needed

      - name: Refresh live points (FPL API)
        run: node sync_fpl.js

      - name: Apply LMP bottom-3 fines
        env:
          GW: ${{ github.event.inputs.gw }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$GW" ]; then ARGS="$ARGS --gw=$GW"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node apply_lmp_fines.js $ARGS

      - name: Generate epithets
        run: node generate_epithets.js

      - name: Commit & push if changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "lmp-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json fpl_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "LMP sync: GW fines + live points [skip ci]"
            git push
          fi
