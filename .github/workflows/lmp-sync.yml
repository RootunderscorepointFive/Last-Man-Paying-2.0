name: LMP weekly sync

# Applies the weekly LMP bottom-3 fines and refreshes live points from the
# public FPL API, then commits the updated data back so Vercel rebuilds.
#
# Timing note: bottom-3 needs FINAL post-hits scores, which include bonus
# points that the FPL API only settles ~1-2 days after a gameweek's matches.
# So this is keyed off the gameweek being *finished*, not the deadline. The
# daily cron + idempotent script means a finished GW is picked up within 24h
# and re-runs are no-ops until there's a new GW to process.

on:
  # Hourly cron is safe to run year-round: the "Season guard" step below skips the
  # sync while the FPL API still serves a previous season's data (off-season),
  # and auto-resumes when the season matching config.current_season kicks off.
  # Runs are idempotent and only commit when something actually changed, so most
  # hourly runs are no-ops; the point is near-real-time standings as managers
  # activate pre-season and as live points/transfers move on match days.
  # Free on public repos (unlimited GitHub-hosted minutes); job is ~15s.
  schedule:
    - cron: '0 * * * *'        # top of every hour (UTC); idempotent, commits only on change
  workflow_dispatch:
    inputs:
      gw:
        description: 'Specific GW to process (blank = latest finished)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (compute only, no commit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write              # needed to commit data.json / fpl_data.json back

concurrency:
  group: lmp-sync              # never let two syncs race on the same files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # backstop: a normal run is ~15s; fail fast instead of hanging
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'   # global fetch built in; no npm install needed

      - name: Season guard
        id: guard
        run: node season_guard.js   # writes proceed=true|false; skips off-season previous-season data

      - name: Refresh live points (FPL API)
        if: steps.guard.outputs.proceed == 'true'
        run: node sync_fpl.js

      - name: Apply LMP bottom-3 fines
        if: steps.guard.outputs.proceed == 'true'
        env:
          GW: ${{ github.event.inputs.gw }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$GW" ]; then ARGS="$ARGS --gw=$GW"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node apply_lmp_fines.js $ARGS

      - name: Generate epithets
        if: ${{ !cancelled() && steps.guard.outputs.proceed == 'true' }}
        run: node generate_epithets.js

      # Runs even if "Apply LMP bottom-3 fines" failed (e.g. FPL API 5xx on one
      # manager after retries) — that failure never touches data.json (the
      # write happens only after every manager's history is fetched), so it's
      # safe to still commit whatever sync_fpl.js already computed. The job
      # still reports failure overall so a genuine fines miss stays visible.
      - name: Commit & push if changed
        if: ${{ !cancelled() && steps.guard.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "lmp-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json fpl_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "LMP sync: GW fines + live points [skip ci]"
            git push
          fi
