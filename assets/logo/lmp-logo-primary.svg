<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-label="LMP, Last Man Paying, Terminal">
  <style>
    .disp{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    .sub{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:500;}
  </style>

  <!-- icon -->
